services:
  # ── Base de datos PostgreSQL ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: emcagua-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-emcagua}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend (Spring Boot) ─────────────────────────────────────
  backend:
    build: ./emcagua-backend
    container_name: emcagua-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EMCAGUA_DB_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-emcagua}
      EMCAGUA_DB_USER:     ${POSTGRES_USER:-postgres}
      EMCAGUA_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EMCAGUA_SECRETO:     ${EMCAGUA_SECRETO:-cambie-esta-clave-larga-de-desarrollo-emcagua-apc-2026}
      EMCAGUA_FRONTEND:    http://localhost
      EMCAGUA_DEMO:        ${EMCAGUA_DEMO:-false}
      EMCAGUA_DDL:         ${EMCAGUA_DDL:-update}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - respaldos:/data/respaldos

  # ── Frontend (React + Nginx) ──────────────────────────────────
  frontend:
    build: ./emcagua-frontend
    container_name: emcagua-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  pgdata:
    name: emcagua-pgdata
  respaldos:
    name: emcagua-respaldos
